<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toposter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Toposter</h1>

    <div class="toolbar">
      <button id="addPostersButton">Add posters</button>

      <input id="posterInput" type="file" accept="image/*" multiple />
    </div>

    <div class="settings">
      <label>
        Rows
        <input id="columnsInput" type="number" min="1" value="5" />
      </label>

      <label>
        Gap
        <input id="gapInput" type="number" min="0" value="10" />
      </label>

      <label>
        Background
        <input id="backgroundInput" type="color" value="#202020" />
      </label>
    </div>

    <div id="posterGrid"></div>

    <script src="script.js"></script>
  </body>
</html>
